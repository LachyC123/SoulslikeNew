<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b120c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Pixel Dungeon</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22 shape-rendering=%22crispEdges%22%3E%3Crect width=%2216%22 height=%2216%22 fill=%22%230b120c%22/%3E%3Crect x=%227%22 y=%222%22 width=%222%22 height=%229%22 fill=%22%23cfd6e0%22/%3E%3Crect x=%224%22 y=%2210%22 width=%228%22 height=%222%22 fill=%22%23e0b04a%22/%3E%3Crect x=%227%22 y=%2212%22 width=%222%22 height=%223%22 fill=%22%238a5a34%22/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <div id="game">
      <canvas id="screen"></canvas>

      <div id="hud" class="hidden">
        <div id="hud-tl">
          <canvas id="portrait" width="16" height="16"></canvas>
          <div class="hp-wrap">
            <div class="hp-bar"><div id="hp-chip"></div><div id="hp-fill"></div><span id="hp-text">100 / 100</span></div>
            <div class="sub-row">
              <div id="flasks"></div>
              <div id="statuses"></div>
              <div id="gold"><i class="coin"></i><span>0</span></div>
            </div>
          </div>
        </div>
        <div id="hud-tc">
          <div id="banner"><span class="orn">◆</span><span id="banner-text">VERDANT RUINS · FLOOR 1</span><span class="orn">◆</span></div>
          <div id="objective"></div>
        </div>
        <div id="hud-tr">
          <canvas id="minimap"></canvas>
          <div class="tr-buttons">
            <button id="btn-bag" class="icon-btn" aria-label="Equipment">🎒</button>
            <button id="btn-pause" class="icon-btn" aria-label="Pause">❚❚</button>
          </div>
        </div>
        <div id="boss-bar" class="hidden">
          <div class="boss-name">The Thorn Warden</div>
          <div class="boss-track"><div id="boss-chip"></div><div id="boss-fill"></div></div>
          <div id="boss-status"></div>
        </div>
        <div id="toasts"></div>
      </div>

      <div id="controls" class="hidden">
        <div id="joy-zone"></div>
        <div id="joy-base"></div>
        <div id="joy-knob"></div>
        <div id="action-cluster">
          <button id="btn-skill" class="ctl ctl-skill"><canvas class="ico" width="32" height="32"></canvas><svg class="cd" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" /></svg><b class="key">L</b></button>
          <div id="skill-cancel">✕ cancel</div>
          <button id="btn-flask" class="ctl ctl-flask"><span class="flask-ico"></span><b class="count">3</b><b class="key">F</b></button>
          <button id="btn-dodge" class="ctl ctl-dodge"><span class="dodge-ico">➶</span><b class="key">Space</b></button>
          <button id="btn-attack" class="ctl ctl-attack"><canvas class="ico" width="32" height="32"></canvas><b class="key">J</b></button>
          <button id="btn-swap" class="ctl ctl-swap"><canvas class="w0" width="32" height="32"></canvas><span class="arrows">⇄</span><canvas class="w1" width="32" height="32"></canvas><b class="key">Q</b></button>
        </div>
      </div>

      <button id="interact" class="hidden"><span class="verb">Open</span><b class="key">E</b></button>

      <div id="overlay"></div>
      <div id="fade"></div>
      <div id="rotate" class="hidden"><div>⟳</div><p>Rotate your device to landscape to play.</p></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
